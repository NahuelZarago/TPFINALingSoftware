name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: ruff
        run: ruff check .
      - name: black
        run: black --check .
      - name: mypy
        run: mypy
      - name: pyright
        run: pyright
      - name: pytest (cobertura >= 85%)
        run: pytest
      - name: bandit
        run: bandit -r tpfi -c pyproject.toml
      - name: Generar documentación
        run: pdoc tpfi -o docs/api
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/api
